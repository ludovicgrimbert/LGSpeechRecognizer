# Regenerate the Xcode project with `xcodegen generate` (run from this directory).
name: LGSpeechRecognizerExample
options:
  bundleIdPrefix: com.LG
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true

packages:
  # The library, from the repository root — the example always builds against the working tree.
  LGSpeechRecognizer:
    path: ..

targets:
  LGSpeechRecognizerExample:
    type: application
    platform: iOS
    sources:
      - path: LGSpeechRecognizerExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.LG.LGSpeechRecognizerExample
        DEVELOPMENT_TEAM: UBS5NLP4XW
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "6.0"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        # Both are required by LiveSpeechRecognizer; the app crashes on the prompt without them.
        INFOPLIST_KEY_NSSpeechRecognitionUsageDescription: "Transcribes what you say, live."
        INFOPLIST_KEY_NSMicrophoneUsageDescription: "Listens to your voice to transcribe it."
    dependencies:
      - package: LGSpeechRecognizer

schemes:
  LGSpeechRecognizerExample:
    build:
      targets:
        LGSpeechRecognizerExample: all
    run:
      config: Debug
